[package]
name = "minus-a"
version = "0.1.0"
edition = "2021"
description = "-A Core Edition compiler: translates -A source into x86-64 assembly"
license = "MIT"

[[bin]]
name = "minus-a"
path = "src/main.rs"

[lib]
name = "minus_a"
path = "src/lib.rs"

[dependencies]
minus-a-backend = { path = "../backend" }

[dev-dependencies]
minus-a-backend = { path = "../backend" }
